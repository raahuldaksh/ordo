name: CI Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: backend
        run: npm run lint

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-test-session-secret-32-chars-long
          ACCESS_TOKEN_SECRET: ci-test-access-token-secret-32-chars
          REFRESH_TOKEN_SECRET: ci-test-refresh-token-secret-32-chars
          OAUTH_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.ordo.app/api/v1
          NEXT_PUBLIC_APP_URL: https://ordo.app
